<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signage Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #000; 
      font-family: sans-serif;
    }
    .slide-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    .slide {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }
    .slide.active {
      opacity: 1;
    }
    #status-badge {
      position: absolute;
      top: 15px; right: 15px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      background: rgba(0,0,0,0.6);
      z-index: 10;
    }
    .online { color: #4ade80 !important; }
    .offline { color: #f87171 !important; }
    .hide-cursor { cursor: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
</head>
<body>
  <div id="status-badge">● <span id="status-text">Conectando...</span></div>
  
  <div class="slide-container" id="player">
    </div>

  <script src="app.js"></script>
</body>
</html>
