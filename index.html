<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Signage Player</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
</head>
<body>
  <!-- Overlay de emparejamiento -->
  <div id="pairing-screen" class="pairing-container hidden">
    <div class="pairing-box">
      <h2>Vincular Pantalla</h2>
      <p>Ingresa este código en tu panel de administración:</p>
      <div id="pairing-code-display" class="pairing-code">------</div>
      <span class="pairing-instruction">Mantén esta pantalla abierta mientras vinculas</span>
    </div>
  </div>

  <!-- Contenedor del reproductor de diapositivas -->
  <div id="slideshow-container">
    <!-- Capa A -->
    <img id="slide-img-a" class="slide" />
    <video id="slide-vid-a" class="slide" muted playsinline></video>

    <!-- Capa B (crossfade) -->
    <img id="slide-img-b" class="slide" />
    <video id="slide-vid-b" class="slide" muted playsinline></video>
  </div>

  <div id="status-indicator">
    <span id="status-text" class="offline">Iniciando...</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
